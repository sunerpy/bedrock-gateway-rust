name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces its run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in step with rust-toolchain.toml, which cargo reads as well.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-09-12
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy

      # Pull requests read main's cache and write none of their own, so they do
      # not crowd main's entries out of the repository's cache quota.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Populate the Cargo registry
        run: cargo fetch --locked

      # fmt check, clippy with all features and with the default features that
      # releases ship, and the tests: the same target as the pre-push hook.
      - name: Check
        run: make check

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-09-12
        with:
          toolchain: 1.98.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Releases ship an x86_64-pc-windows-msvc binary built with the default
      # features; this runs the suite on that platform.
      - name: Run tests
        run: cargo test --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-audit@0.22.2

      - name: Run cargo audit
        run: cargo audit

  # Coverage 为信息型：度量单元测试覆盖率并上传 Codecov，但刻意不进入
  # ci-success 的 needs，因此永不阻塞合并；Codecov 状态本身也是
  # informational（见 codecov.yml），低于目标 % 不会使 PR 变红。
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-09-12
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-features --locked --ignore-filename-regex 'src/main\.rs' --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          # 仅报告：Codecov 上传或处理出错时不让 CI 失败。
          fail_ci_if_error: false
          # 公开仓库支持 tokenless 上传；token 可选（私有仓库必需）。
          token: ${{ secrets.CODECOV_TOKEN }}

  # The one check the main branch ruleset requires. Every job it needs must
  # succeed: a failed, cancelled, timed-out or skipped job fails it. Coverage is
  # informational and deliberately not listed.
  ci-success:
    name: CI Success
    needs: [test, windows, audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"
