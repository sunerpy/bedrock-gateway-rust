# Releases bedrock-gateway in one run.
#
#   release-please   opens or updates the release PR; merging it creates the tag and a DRAFT Release
#   verify           the gate CI runs, cargo audit and a packaging dry run, on the tagged commit
#   build-binaries   five targets; each archive is unpacked and run before it is uploaded
#   upload-assets    SHA256SUMS, an attestation, and the archives attached to the draft
#   release-notes    git-cliff writes the draft's notes
#   docker           the multi-arch image on Docker Hub and Amazon ECR Public
#   publish-crate    crates.io, skipped when the version is already there
#   publish-release  re-reads every asset and makes the draft public
#
# Everything a release promises happens before the last job, so a failure anywhere leaves a
# draft and nothing half-published on GitHub. The crate goes out last because it cannot be
# taken back. A stuck draft is rebuilt with workflow_dispatch and its tag; a published release
# is never rebuilt. Tags carry release-please's component prefix, bedrock-gateway-rust-vX.Y.Z,
# which TAG_PREFIX tells both release scripts about. Events made with GITHUB_TOKEN start no
# other workflow, so nothing here relies on a tag or release event.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing draft release tag to rebuild, for example bedrock-gateway-rust-v0.18.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY_NAME: bedrock-gateway
  CRATE_NAME: bedrock-gateway-rust
  DOCKER_IMAGE: sunerpy/bedrock-gateway-rust
  TAG_PREFIX: bedrock-gateway-rust-
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build_artifacts: ${{ steps.gate.outputs.build_artifacts }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Passes the release-please outputs through on a push, validates the tag of a manual
      # rebuild, and on both paths requires a draft Release whose tag resolves to a commit.
      - name: Resolve release gate
        id: gate
        shell: bash
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REPO: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
        run: bash .github/scripts/resolve-release-gate.sh

  verify:
    name: Verify release tag
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Require the tag to resolve to the release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error title=Release verify::checked-out tag differs from the release commit"
            exit 1
          fi

      # Keep in step with rust-toolchain.toml, which cargo reads as well.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: verify

      - name: Populate the Cargo registry
        run: cargo fetch --locked

      - name: Check
        run: make check

      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependencies
        run: cargo audit

      # Builds the crate from the packaged files alone, the way crates.io will, so that
      # publish-crate below can upload it without compiling it again.
      - name: Package the crate
        run: cargo publish --dry-run --locked

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Build legs run build scripts and dependency code, so they hold no write, id-token or
    # attestations permission; upload-assets attests the archives.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            platform: linux
            use_zigbuild: true
            archive: tar.gz
          # Built on an arm64 runner so that the smoke step below runs the binary that also
          # goes into the arm64 image.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            platform: linux
            use_zigbuild: true
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15
            platform: macos
            execution_arch: x86_64
            use_zigbuild: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-15
            platform: macos
            execution_arch: arm64
            use_zigbuild: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            platform: windows
            use_zigbuild: false
            archive: zip
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Require the tag to resolve to the release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error title=Release build::checked-out tag differs from the release commit"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-zigbuild@0.23.4

      # zigbuild needs the musl sysroot of the target, which `targets:` above does not always
      # install for a cross target; the command is idempotent.
      - name: Add the Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add --toolchain 1.98.0 "$TARGET"

      - name: Populate the Cargo registry
        run: cargo fetch --locked

      - name: Compute the archive name once
        id: names
        shell: bash
        env:
          ARCHIVE_KIND: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          echo "archive=${BINARY_NAME}-${VERSION}-${TARGET}.${ARCHIVE_KIND}" >>"$GITHUB_OUTPUT"

      - name: Build with cargo-zigbuild
        if: matrix.use_zigbuild
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --locked --release -p "$CRATE_NAME" --target "$TARGET"

      - name: Build natively
        if: ${{ !matrix.use_zigbuild }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p "$CRATE_NAME" --target "$TARGET"

      - name: Package and unpack tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          ARCHIVE: ${{ steps.names.outputs.archive }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist unpacked
          tar -czf "dist/${ARCHIVE}" -C "target/${TARGET}/release" "$BINARY_NAME"
          tar -xzf "dist/${ARCHIVE}" -C unpacked
          chmod +x "unpacked/$BINARY_NAME"

      - name: Package and unpack zip
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.names.outputs.archive }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist,unpacked | Out-Null
          Compress-Archive `
            -Path "target/${env:TARGET}/release/${env:BINARY_NAME}.exe" `
            -DestinationPath "dist/${env:ARCHIVE}"
          Expand-Archive -Path "dist/${env:ARCHIVE}" -DestinationPath unpacked -Force

      # Each archive is unpacked and its binary run before it is uploaded; `--version` must
      # print the version being released.
      - name: Smoke packaged artifact on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          output=$("unpacked/$BINARY_NAME" --version)
          echo "$output"
          [ "$output" = "$BINARY_NAME $VERSION" ]

      - name: Smoke packaged artifact on macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          EXECUTION_ARCH: ${{ matrix.execution_arch }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          /usr/bin/lipo "unpacked/$BINARY_NAME" -verify_arch "$EXECUTION_ARCH"
          output=$(/usr/bin/arch "-${EXECUTION_ARCH}" "unpacked/$BINARY_NAME" --version)
          echo "$output"
          [ "$output" = "$BINARY_NAME $VERSION" ]

      - name: Smoke packaged artifact on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          $output = & "unpacked/${env:BINARY_NAME}.exe" --version
          Write-Output $output
          if ("$output" -ne "${env:BINARY_NAME} ${env:VERSION}") { exit 1 }

      - name: Upload smoked build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  upload-assets:
    name: Attach release assets
    needs: [release-please, verify, build-binaries]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Downloads, hashes, attests and uploads; runs no project code, so it is the only job
    # holding id-token: write for the attestation.
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          ((${#archives[@]} == 5)) || { echo "::error::expected 5 release archives, found ${#archives[@]}"; exit 1; }
          printf '%s\n' "${archives[@]}" | LC_ALL=C sort | xargs sha256sum >SHA256SUMS
          cat SHA256SUMS

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attach assets to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(awk '{ print "dist/" $2 }' dist/SHA256SUMS)
          gh release upload "$TAG" "${files[@]}" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify remote asset bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          bash .github/scripts/publish-release-draft.sh --verify-only \
            --checksums dist/SHA256SUMS --asset dist/SHA256SUMS --exact

      - name: Upload checksums for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release-notes:
    name: Write release notes
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release tag with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Write the notes into the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md

  # Packages the Linux binaries that build-binaries ran into a multi-arch image and pushes it
  # once to both registries; it compiles nothing. Docker Hub uses DOCKERHUB_USERNAME/TOKEN;
  # ECR Public uses GitHub OIDC: configure-aws-credentials assumes ECR_PUBLIC_ROLE_ARN in
  # us-east-1, where the ECR Public control plane lives, so no long-lived AWS key exists.
  # `latest` moves only for a stable release; a manual rebuild only ever rebuilds a draft,
  # which is the newest release.
  docker:
    name: Docker Multi-Arch Publish
    needs: [release-please, verify, build-binaries]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Download Linux release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*-unknown-linux-musl
          path: dist

      - name: Prepare architecture-specific Docker context
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p docker-bin/amd64 docker-bin/arm64
          tar -xzf \
            "dist/dist-x86_64-unknown-linux-musl/${BINARY_NAME}-${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -C docker-bin/amd64
          tar -xzf \
            "dist/dist-aarch64-unknown-linux-musl/${BINARY_NAME}-${VERSION}-aarch64-unknown-linux-musl.tar.gz" \
            -C docker-bin/arm64
          chmod 0555 "docker-bin/amd64/${BINARY_NAME}" "docker-bin/arm64/${BINARY_NAME}"
          file "docker-bin/amd64/${BINARY_NAME}" | grep -q 'x86-64'
          file "docker-bin/arm64/${BINARY_NAME}" | grep -Eq 'ARM aarch64|ARM64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ECR_PUBLIC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            public.ecr.aws/${{ vars.ECR_PUBLIC_ALIAS }}/bedrock-gateway-rust
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # crates.io keeps every version forever, so the crate goes out after everything else
  # succeeded and right before the flip. A rerun finds the version in the index and skips.
  publish-crate:
    name: Publish to crates.io
    needs: [release-please, upload-assets, release-notes, docker]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Require the tag to resolve to the release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error title=Release publish::checked-out tag differs from the release commit"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.0

      # The sparse index lists every published version of the crate, one JSON object per line.
      # 200 without the version or 404 means unpublished; any other answer stops the job.
      - name: Check whether crates.io already has this version
        id: index
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o index.jsonl -w '%{http_code}' \
            "https://index.crates.io/be/dr/${CRATE_NAME}")
          case "$status" in
            200)
              if jq -e --arg v "$VERSION" 'select(.vers == $v)' index.jsonl >/dev/null; then
                echo "published=true" >>"$GITHUB_OUTPUT"
                echo "::notice title=crates.io::${CRATE_NAME} ${VERSION} is already published; skipping"
              else
                echo "published=false" >>"$GITHUB_OUTPUT"
              fi
              ;;
            404) echo "published=false" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error title=crates.io::index answered HTTP ${status}"; exit 1 ;;
          esac

      # verify packaged and built this commit with `cargo publish --dry-run --locked`.
      - name: Publish to crates.io
        if: steps.index.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify

  publish-release:
    name: Publish Release
    needs: [release-please, upload-assets, release-notes, docker, publish-crate]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: dist

      - name: Verify remote assets and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          bash .github/scripts/publish-release-draft.sh --publish \
            --checksums dist/SHA256SUMS --asset dist/SHA256SUMS --exact
