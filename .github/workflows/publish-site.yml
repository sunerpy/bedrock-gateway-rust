# Publishes the pages of the bedrock-gateway website to sunerpy/firlab, which builds it and serves it
# inside firlab.app at https://firlab.app/bedrock-gateway/ (firlab: `bedrock-gateway/`,
# `.github/workflows/deploy.yml`). docs/site/README.md describes the whole path.
#
# The sync starts here because the event that should update the site, a merge here, happens in
# this repository, and the credential stays here and reaches firlab only. The copy rules and checks
# live in firlab's sync script, which a local preview runs too, so this workflow and a preview
# produce the same tree.
#
# Nothing is pushed to firlab's main. The sync is committed to one branch, bedrock-gateway-docs/sync,
# which always holds a single commit on top of firlab's main; a pull request from it waits for
# firlab's own checks and is then squash-merged at the exact head that was checked. A failed check
# leaves the pull request open for a person to look at, and the next run updates it.
#
# Needs FIRLAB_DOCS_TOKEN: a fine-grained personal access token for sunerpy/firlab only, with
# Contents and Pull requests read and write and nothing else. A pull request opened with it starts
# firlab's pull request workflows, which one opened with GITHUB_TOKEN would not. GitHub has no API
# that creates such a token, so it is made by hand (docs/site/README.md, "Publishing"). Without it
# the first step fails and says so.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "!docs/site/README.md"
      - "docs/*.md"
      - "docs/deploy/*.md"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

# Queue, never cancel: a cancelled run could leave a sync pull request without its successor.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Sync the site's pages to firlab through a pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the firlab token
        env:
          FIRLAB_DOCS_TOKEN: ${{ secrets.FIRLAB_DOCS_TOKEN }}
        run: |
          if [ -z "${FIRLAB_DOCS_TOKEN}" ]; then
            echo "::error::FIRLAB_DOCS_TOKEN is not set, so the site cannot be updated. docs/site/README.md, Publishing, says how to create it."
            exit 1
          fi

      - name: Checkout bedrock-gateway-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bedrock-gateway-rust
          persist-credentials: false

      # firlab is public: the checkout needs no token, and the push below passes it to git for that
      # command only.
      - name: Checkout firlab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sunerpy/firlab
          path: firlab
          persist-credentials: false

      - name: Sync the pages
        run: ./firlab/bedrock-gateway/scripts/sync-bedrock-gateway-docs.sh "$GITHUB_WORKSPACE/bedrock-gateway-rust"

      - name: Commit the sync to its branch
        id: commit
        working-directory: firlab
        env:
          SOURCE_SHA: ${{ github.sha }}
          FIRLAB_DOCS_TOKEN: ${{ secrets.FIRLAB_DOCS_TOKEN }}
        run: |
          set -euo pipefail
          # `git status`, not `git diff`: a new page is an untracked file, which `git diff` misses.
          if [ -z "$(git status --porcelain -- bedrock-gateway/src)" ]; then
            echo "the site is already up to date; nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch=bedrock-gateway-docs/sync
          git switch -c "$branch"
          # The sync writes nowhere else; staging the tree by name keeps anything else out.
          git add -- bedrock-gateway/src
          git -c user.name='bedrock-gateway-docs[bot]' \
              -c user.email='bedrock-gateway-docs@users.noreply.github.com' \
              commit -m "docs(bedrock-gateway): sync from bedrock-gateway-rust@${SOURCE_SHA:0:7}" \
                     -m "Source: https://github.com/sunerpy/bedrock-gateway-rust/commit/${SOURCE_SHA}"

          # The token reaches git through its environment, the way actions/checkout passes its
          # own, and is never written to .git/config.
          basic=$(printf 'x-access-token:%s' "$FIRLAB_DOCS_TOKEN" | base64 -w0)
          echo "::add-mask::${basic}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"

          # The branch is rebuilt from firlab's current main on every run, so it never carries an
          # older sync or a conflict; a pull request already open from it follows the new head.
          git push --force origin "HEAD:refs/heads/${branch}"
          {
            echo "changed=true"
            echo "branch=${branch}"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FIRLAB_DOCS_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          title="docs(bedrock-gateway): sync from bedrock-gateway-rust@${SOURCE_SHA:0:7}"
          body="Source: https://github.com/sunerpy/bedrock-gateway-rust/commit/${SOURCE_SHA}"
          number=$(gh pr list --repo sunerpy/firlab --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo sunerpy/firlab --title "$title" --body "$body"
          else
            gh pr create --repo sunerpy/firlab --base main --head "$BRANCH" --title "$title" --body "$body"
            number=$(gh pr list --repo sunerpy/firlab --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Wait for firlab's checks, then squash-merge
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FIRLAB_DOCS_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head }}
        run: |
          set -euo pipefail
          # The checks are reported a few seconds after the push. Wait, bounded, until one is.
          # shellcheck disable=SC2016 # $1 belongs to the inner shell
          timeout 300 sh -c 'until [ "$(gh pr checks "$1" --repo sunerpy/firlab 2>/dev/null | wc -l)" -gt 0 ]; do sleep 5; done' _ "$NUMBER"
          # Exits non-zero as soon as one check fails; the pull request then stays open.
          gh pr checks "$NUMBER" --repo sunerpy/firlab --watch --fail-fast --interval 20
          gh pr merge "$NUMBER" --repo sunerpy/firlab --squash --match-head-commit "$HEAD_SHA" --delete-branch
