version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    # Keep stale dependency branches from rebuilding after every default-branch
    # merge. Reviewers can request a manual rebase when they intend to merge.
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
